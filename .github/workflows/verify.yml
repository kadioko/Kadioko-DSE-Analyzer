name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The database-backed tests skip themselves without DATABASE_URL, which
    # would let a real regression pass silently. CI provides PostgreSQL so they
    # actually run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kadioko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kadioko_test
      # Admin routes are disabled without these; set so route modules load.
      ADMIN_EMAIL: ci@example.com
      ADMIN_TOKEN: ci-token-not-a-real-secret
      CRON_SECRET: ci-cron-not-a-real-secret
      DATA_PROVIDER: csv

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate

      - name: Seed reference data
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs the full suite INCLUDING the database integration tests, which are
      # the ones that catch a broken migration or a wrong upsert.
      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Proves the worker still starts and reaches the database. It exits
      # non-zero on a real failure; a missing file for today is expected in CI,
      # so only a crash should fail this step.
      - name: Smoke-test the ingestion worker
        run: |
          set +e
          output=$(npm run ingest -- --date=2026-01-01 --attempts=1 2>&1)
          status=$?
          echo "$output"
          if echo "$output" | grep -q "Ingestion worker crashed"; then
            echo "::error::The ingestion worker crashed rather than reporting a failed run."
            exit 1
          fi
          # A FAILED run for a date with no file is the correct outcome here.
          if [ $status -ne 0 ] && ! echo "$output" | grep -q "No CSV for"; then
            echo "::error::Worker failed for an unexpected reason."
            exit 1
          fi
          exit 0
